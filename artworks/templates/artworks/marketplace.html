{% extends 'base.html' %}

{% block title %}Marketplace - ArtLink{% endblock %}

{% block content %}
<div class="grid">
    <h1>Artwork Marketplace</h1>
    <div class="filters">
        <!-- Add filters here -->
    </div>
    <div class="grid grid-3">
        {% for artwork in artworks %}
        <div class="card">
            <div class="card-image">
                <img src="{% if artwork.images %}{{ artwork.images.url }}{% else %}https://images.unsplash.com/photo-1578662996442-48f60103fc96?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80{% endif %}" alt="{{ artwork.title }}">
            </div>
            <div class="card-content">
                <h3><a href="{% url 'artwork_detail' artwork.pk %}">{{ artwork.title }}</a></h3>
                <p><a href="{% url 'artist_profile' artwork.artist.pk %}">{{ artwork.artist.username }}</a></p>
                <p class="price">${{ artwork.price }}</p>
                <span class="auth-badge">Authentic</span>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
