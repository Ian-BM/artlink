{% extends 'base.html' %}

{% block title %}Artists - ArtLink{% endblock %}

{% block content %}
<style>
    .artists-page {
        padding: 2rem 0;
        max-width: 1400px;
        margin: 0 auto;
        text-align: center;
    }

    .artists-page h1 {
        font-size: 3rem;
        color: #111;
        text-align: center;
        margin-bottom: 3rem;
        font-family: 'Elsie', serif;
        font-weight: 900;
        letter-spacing: 0.02em;
    }

    .artists-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 0.5rem;
        margin-top: 2rem;
        justify-items: center;
        max-width: 100%;
    }

    .artist-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        overflow: hidden;
        transition: all 0.3s ease;
        border: 1px solid rgba(239, 191, 4, 0.1);
    }

    .artist-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 32px rgba(0,0,0,0.15);
        border-color: var(--gold);
    }

    .artist-image-container {
        width: 100%;
        height: 240px;
        overflow: hidden;
        background: linear-gradient(135deg, #f4f2f3 0%, #c3cbd6 100%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .artist-image-container img {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center;
        border: 4px solid white;
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        transition: transform 0.3s ease;
    }

    .artist-card:hover .artist-image-container img {
        transform: scale(1.05);
    }

    .artist-card-content {
        padding: 1.5rem;
        text-align: center;
    }

    .artist-name {
        font-family: 'Elsie', serif;
        font-weight: 900;
        font-size: 1.4rem;
        color: #111;
        margin-bottom: 0.5rem;
        letter-spacing: 0.02em;
    }

    .artist-name a {
        color: #111;
        text-decoration: none;
        transition: color 0.3s;
    }

    .artist-name a:hover {
        color: var(--gold);
    }

    .artist-location {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 0.75rem;
        font-weight: 500;
    }

    .artist-stats {
        color: #111;
        font-size: 0.9rem;
        font-weight: 600;
        background: rgba(239, 191, 4, 0.1);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        display: inline-block;
        border: 1px solid rgba(239, 191, 4, 0.2);
    }

    @media (max-width: 768px) {
        .artists-page h1 {
            font-size: 2.2rem;
            margin-bottom: 2rem;
        }

        .artists-grid {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0.25rem;
            justify-items: center;
        }

        .artist-image-container {
            height: 200px;
        }

        .artist-image-container img {
            width: 140px;
            height: 140px;
        }

        .artist-card-content {
            padding: 1.25rem;
        }
    }
</style>

<div class="grid artists-page">
    <h1>Featured Artists</h1>
    <div class="artists-grid">
        {% for profile in artists %}
        <div class="artist-card">
            <div class="artist-image-container">
                <img src="{% if profile.profile_image %}{{ profile.profile_image.url }}{% else %}https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80{% endif %}" alt="{{ profile.user.username }}">
            </div>
            <div class="artist-card-content">
                <h3 class="artist-name"><a href="{% url 'artist_profile' profile.user.pk %}">{{ profile.user.username }}</a></h3>
                <p class="artist-location">{{ profile.location|default:"Global" }}</p>
                <span class="artist-stats">{{ profile.total_artworks_sold }} artworks sold</span>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
