{% extends 'base.html' %}

{% block content %}
<style>
    .studio-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: calc(100vh - 82px);
        max-width: 1440px;
        margin: 0 auto;
    }

    .studio-sidebar {
        background: rgba(255, 255, 255, 0.96);
        border-right: 1px solid var(--border);
        padding: 1.75rem 1.25rem;
        position: sticky;
        top: 82px;
        height: calc(100vh - 82px);
        overflow-y: auto;
    }

    .studio-brand {
        font-family: 'Elsie', serif;
        font-size: 1.45rem;
        font-weight: 900;
        color: #111;
        margin-bottom: 0.35rem;
    }

    .studio-brand-sub {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1.75rem;
        line-height: 1.5;
    }

    .studio-nav {
        display: grid;
        gap: 0.35rem;
    }

    .studio-nav a {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.75rem 0.85rem;
        border-radius: 10px;
        text-decoration: none;
        color: #333;
        font-weight: 600;
        transition: background-color 0.2s, color 0.2s, transform 0.2s;
    }

    .studio-nav a:hover {
        background: rgba(239, 191, 4, 0.1);
        color: #111;
    }

    .studio-nav a.is-active {
        background: rgba(239, 191, 4, 0.16);
        color: #111;
        border: 1px solid rgba(239, 191, 4, 0.35);
    }

    .studio-nav-divider {
        height: 1px;
        background: var(--border);
        margin: 0.85rem 0;
    }

    .studio-main {
        padding: 2rem 2rem 3rem;
    }

    .studio-header {
        margin-bottom: 2rem;
    }

    .studio-header h1 {
        font-family: 'Elsie', serif;
        font-size: clamp(2rem, 3.5vw, 2.8rem);
        line-height: 1;
        color: #111;
        margin: 0 0 0.5rem;
    }

    .studio-header p {
        color: var(--muted);
        margin: 0;
        max-width: 640px;
        line-height: 1.6;
    }

    .studio-metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .studio-metric {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        box-shadow: var(--shadow-soft);
    }

    .studio-metric-value {
        font-size: 2rem;
        font-weight: 800;
        color: var(--gold-dark);
        line-height: 1;
        margin-bottom: 0.35rem;
    }

    .studio-metric-label {
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 600;
    }

    .studio-panel {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-soft);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .studio-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.25rem;
        padding-bottom: 0.85rem;
        border-bottom: 2px solid rgba(239, 191, 4, 0.35);
    }

    .studio-panel-header h2 {
        margin: 0;
        font-size: 1.35rem;
        color: #111;
    }

    .studio-actions {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
    }

    .studio-table-wrap {
        overflow-x: auto;
    }

    .studio-table {
        width: 100%;
        border-collapse: collapse;
    }

    .studio-table th,
    .studio-table td {
        padding: 0.85rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
    }

    .studio-table th {
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
    }

    .studio-table tr:hover {
        background: rgba(239, 191, 4, 0.04);
    }

    .studio-table img {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 8px;
    }

    .status-pill {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
    }

    .status-available,
    .status-published,
    .status-new {
        background: rgba(39, 174, 96, 0.12);
        color: #17633b;
    }

    .status-sold,
    .status-declined {
        background: rgba(220, 53, 69, 0.12);
        color: #842029;
    }

    .status-draft,
    .status-contacted {
        background: rgba(239, 191, 4, 0.14);
        color: #4a3710;
    }

    .status-completed {
        background: rgba(52, 152, 219, 0.12);
        color: #1f4f73;
    }

    .inline-actions {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
    }

    .inline-btn {
        border: none;
        border-radius: 6px;
        padding: 0.4rem 0.65rem;
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        color: #fff;
    }

    .inline-btn-edit { background: #3498db; }
    .inline-btn-delete { background: #d9534f; }
    .inline-btn-neutral { background: #111; color: #fff; }
    .inline-btn-gold { background: var(--gold); color: #111; }

    .activity-list {
        display: grid;
        gap: 0.85rem;
    }

    .activity-item {
        display: grid;
        gap: 0.25rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
    }

    .activity-item strong {
        color: #111;
    }

    .activity-item span {
        color: var(--muted);
        font-size: 0.9rem;
    }

    .empty-studio {
        text-align: center;
        color: var(--muted);
        padding: 2rem 1rem;
    }

    @media (max-width: 980px) {
        .studio-shell {
            grid-template-columns: 1fr;
        }

        .studio-sidebar {
            position: static;
            height: auto;
            border-right: none;
            border-bottom: 1px solid var(--border);
        }

        .studio-nav {
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }

        .studio-main {
            padding: 1.25rem 1rem 2rem;
        }
    }
</style>

<div class="studio-shell">
    <aside class="studio-sidebar">
        <div class="studio-brand">Creator Studio</div>
        <p class="studio-brand-sub">Manage artworks, commissions, exhibitions, and sales in one place.</p>
        <nav class="studio-nav">
            <a href="{% url 'dashboard' %}" class="{% if active_section == 'overview' %}is-active{% endif %}">Dashboard Overview</a>
            <a href="{% url 'dashboard_artworks' %}" class="{% if active_section == 'artworks' %}is-active{% endif %}">My Artworks</a>
            <a href="{% url 'inquiry_inbox' %}" class="{% if active_section == 'inquiries' %}is-active{% endif %}">Inquiries</a>
            <a href="{% url 'custom_request_inbox' %}" class="{% if active_section == 'custom_requests' %}is-active{% endif %}">Custom Requests</a>
            <a href="{% url 'dashboard_exhibitions' %}" class="{% if active_section == 'exhibitions' %}is-active{% endif %}">Exhibitions</a>
            <a href="{% url 'dashboard_sales' %}" class="{% if active_section == 'sales' %}is-active{% endif %}">Sales</a>
            <div class="studio-nav-divider"></div>
            <a href="{% url 'edit_artist_profile' %}" class="{% if active_section == 'profile' %}is-active{% endif %}">Profile</a>
            <a href="{% url 'artist_profile' request.user.pk %}" class="{% if active_section == 'settings' %}is-active{% endif %}">Public Profile</a>
        </nav>
    </aside>
    <div class="studio-main">
        {% block studio_content %}{% endblock %}
    </div>
</div>
{% endblock %}
